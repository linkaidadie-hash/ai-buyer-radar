# Requirement Spec 示例： embroidery-order-system
# 刺绣工单系统需求规范

project: embroidery-order-system
version: "1.0"
description: 刺绣工厂工单管理系统，包含客户端、工厂端、订单审批等核心功能

must_have:
  # 客户端功能
  - 客户端
  - 订单创建
  - 订单查询
  - 图片上传
  - 图片预览
  - 订单状态查看

  # 工厂端功能
  - 工厂端
  - 工单接收
  - 工序管理
  - 产量录入
  - 工单进度更新

  # 核心业务
  - 订单审批
  - 审批流程
  - 审批记录
  - 交货管理
  - 出货导出

  # 数据管理
  - 客户管理
  - 产品管理
  - 员工管理

must_not_have:
  # 不做
  - CRM
  - ERP
  - 财务系统
  - 会计模块
  - 税务申报
  - 会员系统
  - 用户积分
  - 优惠券
  - 订阅管理
  - 消息推送
  - 社交分享
  - 评价系统

entities:
  - order
  - customer
  - factory
  - product
  - employee
  - approval_record
  - shipment

critical_flows:
  - create_order
  - modify_order_with_approval
  - approve_order
  - reject_order
  - update_production_progress
  - shipment_export
  - view_order_status